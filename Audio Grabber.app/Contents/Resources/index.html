<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audio Grabber</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #17141f; --card: #211c2e; --card2: #1a1626; --text: #efedfb;
    --muted: #8d85b5; --accent: #7f77dd; --accent-soft: #afa9ec;
    --accent-text: #1a1532; --border: #382f52; --ok: #5dcaa5; --err: #ed93b1;
    --warn: #ef9f27;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px -apple-system, "SF Pro Text", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 60px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 18px; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .spacer { flex: 1; }
  .pill { font-size: 12px; padding: 4px 12px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--border); color: var(--muted); }
  .pill.ok { color: var(--ok); } .pill.err { color: var(--err); } .pill.warn { color: var(--warn); }
  .card { background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 18px; margin-bottom: 16px; }
  textarea { width: 100%; min-height: 88px; resize: vertical; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card2); color: var(--text);
    padding: 12px; font: 13px ui-monospace, Menlo, monospace; }
  textarea::placeholder, input::placeholder { color: #5f5780; }
  textarea:focus, select:focus, input:focus { outline: none; border-color: var(--accent); }
  label { font-size: 12px; color: var(--muted); display: block; margin: 0 0 4px; }
  select, input[type=text] { width: 100%; padding: 8px 10px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card2); color: var(--text); font-size: 13px;
    -webkit-appearance: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button { border: 1px solid var(--border); border-radius: 999px; padding: 9px 18px;
    font-size: 14px; cursor: pointer; background: var(--card2); color: var(--accent-soft); }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text);
    border-color: var(--accent); font-weight: 600; }
  button.primary:hover { background: var(--accent-soft); }
  button.small { padding: 4px 12px; font-size: 12px; }
  button:disabled { opacity: .45; cursor: default; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .chk input { accent-color: var(--accent); }
  .chk label { margin: 0; color: var(--text); }
  details summary { cursor: pointer; color: var(--accent-soft); font-size: 13px;
    margin: 12px 0 8px; user-select: none; }
  .folder-line { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
  .folder-path { flex: 1; font: 12px ui-monospace, Menlo, monospace; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .job { border-top: 1px solid var(--border); padding: 12px 0; }
  .job:first-child { border-top: none; }
  .job-head { display: flex; gap: 12px; align-items: center; }
  .thumb { width: 56px; height: 42px; border-radius: 8px; background: var(--card2);
    object-fit: cover; flex: none; display: flex; align-items: center;
    justify-content: center; color: var(--muted); font-size: 18px;
    border: 1px solid var(--border); }
  .job-body { flex: 1; min-width: 0; }
  .job-title { font-size: 13px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .job-meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .bar { height: 5px; border-radius: 3px; background: var(--border); margin-top: 7px;
    overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent-soft); width: 0;
    transition: width .4s; border-radius: 3px; }
  .bar.done i { background: var(--ok); } .bar.error i { background: var(--err); }
  .status-done { color: var(--ok); } .status-error { color: var(--err); }
  .status-running { color: var(--accent-soft); } .status-cancelled { color: var(--warn); }
  pre.log { background: var(--bg); border-radius: 10px; padding: 10px; max-height: 240px;
    overflow: auto; font: 11px ui-monospace, Menlo, monospace; white-space: pre-wrap;
    word-break: break-all; margin: 8px 0 0; color: var(--muted); }
  .banner { border-radius: 12px; padding: 11px 15px; font-size: 13px; margin-bottom: 14px; }
  .banner.warn { background: rgba(239,159,10,.10); color: var(--warn);
    border: 1px solid rgba(239,159,10,.25); }
  .banner.info { background: rgba(127,119,221,.12); color: var(--accent-soft);
    border: 1px solid rgba(127,119,221,.3); }
  .empty { color: var(--muted); text-align: center; padding: 20px 0; font-size: 13px; }
  footer { color: #5f5780; font-size: 12px; text-align: center; margin-top: 24px; }
  a { color: var(--accent-soft); text-decoration: none; }
  b { color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🎧</div>
    <h1>Audio Grabber</h1>
    <span class="pill" id="pill-ytdlp">yt-dlp: …</span>
    <span class="pill" id="pill-ffmpeg">ffmpeg: …</span>
    <div class="spacer"></div>
    <button class="small" id="btn-update">Update yt-dlp</button>
    <button class="small" id="btn-quit">Quit</button>
  </header>

  <div id="banner" class="banner info" style="display:none"></div>

  <div class="card">
    <label>Video links — one per line (YouTube, Twitch, and 1000+ sites). Paste several for a bulk download.</label>
    <textarea id="urls" placeholder="https://www.youtube.com/watch?v=…&#10;https://www.twitch.tv/videos/…"></textarea>

    <div class="grid" style="margin-top:12px">
      <div><label>Mode</label>
        <select id="mode">
          <option value="audio">Audio only</option>
          <option value="video">Video</option>
        </select></div>
      <div id="f-audioFormat"><label>Audio format</label>
        <select id="audioFormat">
          <option>mp3</option><option>m4a</option><option>opus</option>
          <option>flac</option><option>wav</option><option>aac</option>
          <option value="best">best (no conversion)</option>
        </select></div>
      <div id="f-audioQuality"><label>Audio quality</label>
        <select id="audioQuality">
          <option value="0">Best (0)</option><option value="2">High (2)</option>
          <option value="5">Medium (5)</option><option value="7">Small file (7)</option>
        </select></div>
      <div id="f-maxHeight" style="display:none"><label>Max resolution</label>
        <select id="maxHeight">
          <option value="best">Best</option><option value="2160">4K</option>
          <option value="1440">1440p</option><option value="1080">1080p</option>
          <option value="720">720p</option>
        </select></div>
      <div id="f-container" style="display:none"><label>Container</label>
        <select id="container">
          <option value="">keep original</option><option>mp4</option><option>mkv</option>
        </select></div>
    </div>

    <div class="row" style="margin-top:14px">
      <span class="chk"><input type="checkbox" id="embedThumbnail" checked><label for="embedThumbnail">Embed cover art</label></span>
      <span class="chk"><input type="checkbox" id="embedMetadata" checked><label for="embedMetadata">Embed metadata</label></span>
      <span class="chk"><input type="checkbox" id="playlist"><label for="playlist">Whole playlist</label></span>
      <span class="chk"><input type="checkbox" id="sponsorblock"><label for="sponsorblock">Remove sponsor segments</label></span>
      <span class="chk" id="f-subs" style="display:none"><input type="checkbox" id="subtitles"><label for="subtitles">Subtitles</label></span>
    </div>

    <details>
      <summary>Advanced options</summary>
      <div class="grid">
        <div><label>Filename template</label>
          <input type="text" id="template" placeholder="%(title)s.%(ext)s"></div>
        <div><label>Time range (e.g. 00:01:00-00:02:30)</label>
          <input type="text" id="timeRange" placeholder="start-end"></div>
        <div><label>Speed limit (e.g. 2M)</label>
          <input type="text" id="rateLimit" placeholder="unlimited"></div>
        <div><label>Cookies from browser (private/member videos)</label>
          <select id="cookiesBrowser">
            <option value="">none</option><option>safari</option><option>chrome</option>
            <option>firefox</option><option>edge</option><option>brave</option>
          </select></div>
        <div><label>Subtitle languages</label>
          <input type="text" id="subLangs" placeholder="en,de,fr"></div>
        <div><label>Proxy</label>
          <input type="text" id="proxy" placeholder="http://…"></div>
        <div><label>Parallel downloads</label>
          <select id="parallel"><option>1</option><option>2</option><option>3</option></select></div>
        <div style="grid-column:1/-1"><label>Extra yt-dlp arguments (full power — anything yt-dlp accepts)</label>
          <input type="text" id="extraArgs" placeholder="--write-description --no-mtime …"></div>
      </div>
    </details>

    <div class="folder-line">
      <button id="btn-folder">📁 Save to…</button>
      <span class="folder-path" id="folder">~/Downloads</span>
      <button class="small" id="btn-open-folder">Open</button>
    </div>

    <div class="row" style="margin-top:16px">
      <button class="primary" id="btn-go">⬇ Download</button>
      <span id="queue-hint" style="color:var(--muted);font-size:12px"></span>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <strong>Queue</strong>
      <button class="small" id="btn-clear">Clear finished</button>
    </div>
    <div id="jobs"><div class="empty">Nothing yet — paste a link above and hit Download.</div></div>
  </div>

  <footer>Audio Grabber · powered by <a href="https://github.com/yt-dlp/yt-dlp" target="_blank">yt-dlp</a> · runs 100% on your Mac</footer>
</div>

<script>
const $ = id => document.getElementById(id);
const api = (p, body) => fetch(p, body ? {method:'POST', body: JSON.stringify(body)} : {})
  .then(r => r.json()).catch(() => null);
let folder = '';
let openLogs = new Set();

function ytThumb(url) {
  const m = (url || '').match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/);
  return m ? `https://i.ytimg.com/vi/${m[1]}/mqdefault.jpg` : null;
}

function options() {
  return {
    mode: $('mode').value, audioFormat: $('audioFormat').value,
    audioQuality: $('audioQuality').value, maxHeight: $('maxHeight').value,
    container: $('container').value,
    embedThumbnail: $('embedThumbnail').checked, embedMetadata: $('embedMetadata').checked,
    playlist: $('playlist').checked, sponsorblock: $('sponsorblock').checked,
    subtitles: $('subtitles').checked, subLangs: $('subLangs').value.trim(),
    template: $('template').value.trim(), timeRange: $('timeRange').value.trim(),
    rateLimit: $('rateLimit').value.trim(), cookiesBrowser: $('cookiesBrowser').value,
    proxy: $('proxy').value.trim(), extraArgs: $('extraArgs').value.trim(),
    folder
  };
}

function applyOptions(o) {
  if (!o) return;
  const set = (id, v) => { if (v !== undefined && $(id)) $(id).value = v; };
  const chk = (id, v) => { if (v !== undefined && $(id)) $(id).checked = !!v; };
  set('mode', o.mode); set('audioFormat', o.audioFormat); set('audioQuality', o.audioQuality);
  set('maxHeight', o.maxHeight); set('container', o.container);
  chk('embedThumbnail', o.embedThumbnail); chk('embedMetadata', o.embedMetadata);
  chk('playlist', o.playlist); chk('sponsorblock', o.sponsorblock); chk('subtitles', o.subtitles);
  set('subLangs', o.subLangs); set('template', o.template); set('timeRange', o.timeRange);
  set('rateLimit', o.rateLimit); set('cookiesBrowser', o.cookiesBrowser);
  set('proxy', o.proxy); set('extraArgs', o.extraArgs);
  modeChanged();
}

function modeChanged() {
  const audio = $('mode').value === 'audio';
  $('f-audioFormat').style.display = audio ? '' : 'none';
  $('f-audioQuality').style.display = audio ? '' : 'none';
  $('f-maxHeight').style.display = audio ? 'none' : '';
  $('f-container').style.display = audio ? 'none' : '';
  $('f-subs').style.display = audio ? 'none' : '';
}
$('mode').onchange = modeChanged;

async function refreshStatus() {
  const s = await api('/api/status');
  if (!s) return;
  const yp = $('pill-ytdlp'), fp = $('pill-ffmpeg'), banner = $('banner');
  if (s.ytdlp) { yp.textContent = 'yt-dlp ' + s.ytdlp; yp.className = 'pill ok'; }
  else { yp.textContent = 'yt-dlp: missing'; yp.className = 'pill err'; }
  fp.textContent = s.ffmpeg ? 'ffmpeg ✓' : 'ffmpeg missing';
  fp.className = 'pill ' + (s.ffmpeg ? 'ok' : 'warn');
  folder = s.defaultFolder || folder;
  $('folder').textContent = folder;
  if (s.settings && s.settings.parallel) $('parallel').value = s.settings.parallel;
  if (!window._optsApplied && s.settings && s.settings.lastOptions) {
    applyOptions(s.settings.lastOptions); window._optsApplied = true;
  }
  banner.style.display = 'none';
  if (s.install.state === 'working') {
    banner.style.display = ''; banner.className = 'banner info';
    banner.textContent = '⏳ ' + s.install.msg;
  } else if (s.install.state === 'error') {
    banner.style.display = ''; banner.className = 'banner warn';
    banner.textContent = '⚠️ ' + s.install.msg + ' — check your internet connection, then click "Update yt-dlp".';
  } else if (!s.ffmpeg) {
    banner.style.display = ''; banner.className = 'banner warn';
    banner.innerHTML = '⚠️ ffmpeg not found — needed to convert audio (mp3, flac …). Install with: <b>brew install ffmpeg</b>. Downloads in "best" format still work.';
  }
  $('btn-go').disabled = !s.ytdlp;
}

function jobRow(j) {
  const div = document.createElement('div');
  div.className = 'job';
  const pct = j.percent ? j.percent.toFixed(1) + '%' : '';
  const meta = j.status === 'running'
    ? `${pct} ${j.speed} ${j.eta ? 'ETA ' + j.eta : ''}` : j.status;
  const t = ytThumb(j.url);
  const thumb = t
    ? `<img class="thumb" src="${t}" alt="" onerror="this.outerHTML='<div class=thumb>♪</div>'">`
    : `<div class="thumb">♪</div>`;
  div.innerHTML = `
    <div class="job-head">
      ${thumb}
      <div class="job-body">
        <div class="job-title" title="${j.url}">${j.title || j.url}</div>
        <div class="bar ${j.status === 'done' ? 'done' : ''} ${j.status === 'error' ? 'error' : ''}">
          <i style="width:${j.status === 'done' ? 100 : j.percent || 0}%"></i></div>
      </div>
      <span class="job-meta status-${j.status}">${meta}</span>
      ${j.status === 'running' || j.status === 'queued'
        ? `<button class="small" data-cancel="${j.id}">✕</button>`
        : `<button class="small" data-retry="${j.id}">↻</button>`}
      <button class="small" data-log="${j.id}">log</button>
    </div>
    <pre class="log" id="log-${j.id}" style="display:${openLogs.has(j.id) ? '' : 'none'}"></pre>`;
  return div;
}

async function refreshJobs() {
  const jobs = await api('/api/jobs');
  if (!jobs) return;
  const box = $('jobs');
  box.innerHTML = '';
  if (!jobs.length) {
    box.innerHTML = '<div class="empty">Nothing yet — paste a link above and hit Download.</div>';
    return;
  }
  jobs.slice().reverse().forEach(j => box.appendChild(jobRow(j)));
  for (const id of openLogs) {
    const r = await api('/api/log/' + id);
    const el = $('log-' + id);
    if (el && r) { el.textContent = r.log.join('\n'); el.scrollTop = el.scrollHeight; }
  }
  const active = jobs.filter(j => j.status === 'running' || j.status === 'queued').length;
  $('queue-hint').textContent = active ? active + ' in queue' : '';
}

async function clipboardPrefill() {
  if ($('urls').value.trim()) return;
  const r = await api('/api/clipboard');
  if (!r || !r.text) return;
  const urls = r.text.split(/\s+/).filter(u => /^https?:\/\/\S+/.test(u));
  if (urls.length && urls.length < 30) $('urls').value = urls.join('\n');
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.cancel) api('/api/cancel', {id: +b.dataset.cancel});
  if (b.dataset.retry) api('/api/retry', {id: +b.dataset.retry});
  if (b.dataset.log) {
    const id = +b.dataset.log;
    openLogs.has(id) ? openLogs.delete(id) : openLogs.add(id);
    refreshJobs();
  }
});

$('btn-go').onclick = async () => {
  const urls = $('urls').value.split('\n').map(u => u.trim()).filter(Boolean);
  if (!urls.length) return;
  await api('/api/settings', {parallel: $('parallel').value});
  await api('/api/queue', {urls, options: options()});
  $('urls').value = '';
  refreshJobs();
};
$('btn-folder').onclick = async () => {
  const r = await api('/api/choose-folder', {});
  if (r && r.folder) { folder = r.folder; $('folder').textContent = folder; }
};
$('btn-open-folder').onclick = () => api('/api/open-folder', {folder});
$('btn-clear').onclick = () => api('/api/clear', {}).then(refreshJobs);
$('btn-update').onclick = () => api('/api/install-ytdlp', {}).then(refreshStatus);
$('btn-quit').onclick = async () => {
  await api('/api/quit', {});
  document.body.innerHTML = '<div style="text-align:center;padding:80px;color:#8d85b5">Audio Grabber stopped. You can close this window.</div>';
};

modeChanged();
refreshStatus();
refreshJobs();
clipboardPrefill();
setInterval(refreshStatus, 4000);
setInterval(refreshJobs, 1200);
</script>
</body>
</html>
